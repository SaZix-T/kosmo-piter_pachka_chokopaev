<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Планирование ВКД (MVP) — UTC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-dark text-light">
    <div class="container py-4">
      <div class="text-center mb-3">
        <h1 class="h4">Планирование ВКД (MVP)</h1>
        <p class="text-secondary mb-0">Время в UTC</p>
      </div>

      <div class="card bg-secondary bg-opacity-10 border-0">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="start-utc" class="form-label">Начало ВКД (UTC)</label>
              <input id="start-utc" class="form-control" type="text" placeholder="2024-06-05 12:00" value="{{ start_value }}" />
              <div class="form-text text-muted">Формат: YYYY-MM-DD HH:MM (UTC) или ISO 8601 с Z</div>
            </div>
            <div class="col-md-3">
              <label for="duration" class="form-label">Длительность, ч (1–8)</label>
              <input id="duration" class="form-control" type="number" min="1" max="8" step="1" value="{{ duration_value }}" />
            </div>
            <div class="col-md-3 d-flex gap-2 align-items-center">
              <button id="btn-now" class="btn btn-outline-light flex-fill" type="button">Сейчас</button>
              <button id="btn-calc" class="btn btn-success flex-fill" type="button">Рассчитать</button>
            </div>
          </div>
        </div>
      </div>

      <div id="result" class="mt-3" style="display:none;">
        <div class="card bg-secondary bg-opacity-10 border-0">
          <div class="card-body">
            <h2 class="h5">Результат</h2>
            <p id="meta" class="mb-2"></p>
            <p id="tle" class="text-secondary"></p>
            <div id="map" class="mt-2 border rounded" style="height: 420px;"></div>
          </div>
        </div>
      </div>

      <div id="windows" class="mt-3" style="display:none;">
        <div class="card bg-secondary bg-opacity-10 border-0">
          <div class="card-body">
            <h2 class="h5">Сравнение окон</h2>
            <div id="windows-list" class="d-flex flex-column gap-3"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      const $ = (sel) => document.querySelector(sel);
      let map, marker, tileLayer;

      async function fetchJSON(url, opts) {
        const resp = await fetch(url, opts);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      }

      function ensureMap(lat, lon) {
        if (!map) {
          map = L.map('map', { worldCopyJump: true });
          tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 5,
            minZoom: 1,
            attribution: '&copy; OpenStreetMap contributors',
          }).addTo(map);
        }
        map.setView([lat, lon], 3);
        if (marker) marker.setLatLng([lat, lon]);
        else marker = L.circleMarker([lat, lon], { radius: 6, color: '#f1a600', weight: 2, fillColor: '#f1a600', fillOpacity: 0.8 }).addTo(map);
      }

      async function setNow() {
        const j = await fetchJSON('/api/iss/now', { method: 'POST' });
        $('#start-utc').value = j.now;
      }

      function asISO(zulu) {
        if (!zulu) return null;
        if (zulu.endsWith('Z')) return zulu;
        // try parse "YYYY-MM-DD HH:MM"
        const m = zulu.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
        if (m) return `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00Z`;
        return zulu; // hope ISO-like
      }

      function renderWindows(wrap, windows) {
        wrap.innerHTML = '';
        for (const w of windows) {
          const start = new Date(w.start);
          const end = new Date(w.end);
          const totalMs = end - start;
          const card = document.createElement('div');
          card.className = 'card bg-secondary bg-opacity-10 border-0 eva-window';
          const body = document.createElement('div');
          body.className = 'card-body';
          const header = document.createElement('div');
          header.className = 'd-flex justify-content-between align-items-center mb-1';
          header.innerHTML = `<div class="fw-semibold">Окно #${w.id}</div><div class="text-secondary small">Длительность: ${Math.round(w.duration_minutes/60)} ч</div>`;

          const times = document.createElement('div');
          times.className = 'd-flex justify-content-between small mb-2';
          times.innerHTML = `<div class=\"text-secondary\">Начало: ${w.start}</div><div class=\"text-secondary\">Окончание: ${w.end}</div>`;

          const timeline = document.createElement('div');
          timeline.className = 'timeline position-relative mb-2';
          const track = document.createElement('div');
          track.className = 'timeline-track';
          timeline.appendChild(track);
          for (const s of w.segments) {
            const seg = document.createElement('div');
            seg.className = 'segment ' + (s.level === 'good' ? 'bg-success' : 'bg-danger');
            const left = (new Date(s.start) - start) / totalMs * 100;
            const width = (new Date(s.end) - new Date(s.start)) / totalMs * 100;
            seg.style.left = `${left}%`;
            seg.style.width = `${width}%`;
            seg.title = (s.level === 'good' ? 'Благоприятно' : 'Неблагоприятно') + ` ${s.start} — ${s.end}`;
            timeline.appendChild(seg);
          }

          const weather = document.createElement('div');
          const badgeClass = w.weather_status === 'good' ? 'bg-success' : (w.weather_status === 'warn' ? 'bg-warning text-dark' : 'bg-danger');
          const badge = `<span class="badge ${badgeClass}">Погода: ${w.weather_status === 'good' ? 'благоприятно' : (w.weather_status === 'warn' ? 'настороженно' : 'неблагоприятно')}</span>`;
          weather.innerHTML = badge;

          const threats = document.createElement('div');
          threats.className = 'small';
          const crit = (w.threats_critical && w.threats_critical.length && w.threats_critical[0] !== '—') ? w.threats_critical.join(', ') : 'нет';
          const minor = (w.threats_minor && w.threats_minor.length) ? w.threats_minor.join(', ') : 'нет';
          threats.innerHTML = `<div class="text-danger">Серьёзные угрозы: ${crit}</div><div class="text-warning">Угрозы: ${minor}</div>`;

          body.appendChild(header);
          body.appendChild(times);
          body.appendChild(timeline);
          body.appendChild(weather);
          body.appendChild(threats);
          card.appendChild(body);
          wrap.appendChild(card);
        }
      }

      async function calculate() {
        const start = $('#start-utc').value.trim();
        const duration = $('#duration').value.trim();
        const fd = new FormData();
        fd.append('at', start);
        const data = await fetchJSON('/api/iss/position', { method: 'POST', body: fd });
        $('#result').style.display = '';
        $('#meta').textContent = `Запрос: начало ${data.timestamp_utc}, длительность ${duration} ч. Позиция: широта ${data.lat_deg.toFixed(3)}°, долгота ${data.lon_deg.toFixed(3)}°, высота ${data.alt_km.toFixed(1)} км.`;
        $('#tle').textContent = `TLE эпоха: ${data.tle_epoch_utc}, давность: ${data.epoch_age_min.toFixed(1)} мин${data.stale ? ' (устарело)' : ''}`;
        ensureMap(data.lat_deg, data.lon_deg);

        // Fetch and render demo EVA windows
        const fd2 = new FormData();
        fd2.append('start', asISO(start));
        fd2.append('duration', duration);
        const wresp = await fetchJSON('/api/eva/windows', { method: 'POST', body: fd2 });
        renderWindows($('#windows-list'), wresp.windows || []);
        $('#windows').style.display = '';
      }

      $('#btn-now').addEventListener('click', () => setNow().catch(console.error));
      $('#btn-calc').addEventListener('click', () => calculate().catch(err => alert('Ошибка: ' + err.message)));
    </script>
    <style>
      .eva-window .timeline{height:14px}
      .eva-window .timeline-track{position:absolute;inset:0;background:rgba(255,255,255,0.08);border-radius:7px}
      .eva-window .segment{position:absolute;top:0;height:100%;border-radius:7px;opacity:.95}
      .eva-window .segment:hover{filter:brightness(1.05)}
    </style>
  </body>
  </html>
