<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Прогнозирование рисков ВКД{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/glass.css') }}" rel="stylesheet">

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>

<!-- Космический фон: градиент + звёзды -->
<div class="cosmos-bg" aria-hidden="true">
  <div class="cosmos-glow cosmos-glow-1"></div>
  <div class="cosmos-glow cosmos-glow-2"></div>
  <div class="cosmos-stars" id="starsLayer"></div>
</div>

<!-- Навигация -->
<nav class="glass-nav">
  <div class="container-fluid d-flex align-items-center justify-content-between px-4 py-2">
    <a class="brand" href="/">
      <i class="bi bi-rocket-takeoff"></i>
      <span>КосмоХакатон · ВКД</span>
    </a>
    <div class="nav-links d-flex gap-2">
      <a class="nav-pill {% if request.path == '/' %}active{% endif %}" href="/">
        <i class="bi bi-grid-1x2"></i> Анализ
      </a>
      <a class="nav-pill {% if request.path == '/sources' %}active{% endif %}" href="/sources">
        <i class="bi bi-hdd-network"></i> Источники
      </a>
      
    </div>
  </div>
</nav>

<main class="container-xl py-4">
  {% block content %}{% endblock %}
</main>

<footer class="text-center py-4 text-muted small">
  КосмоХакатон 2026 · исследовательский прототип · не для реальных ВКД
</footer>

</body>
</html>
